<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Simulasi Pop-up YouTube</title>
  <style>
    /* Overlay latar belakang */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* Kotak Pop-up */
    .modal-box {
      background-color: #212121;
      color: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      font-family: Arial, sans-serif;
    }

    .modal-text {
      margin-bottom: 20px;
      font-size: 15px;
    }

    .modal-button {
      background: transparent;
      color: #3ea6ff;
      border: none;
      font-weight: bold;
      cursor: pointer;
      float: right;
      padding: 8px 12px;
    }

    /* Tampilan aktif */
    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }
  </style>
</head>
<body>
<button onclick="mulaiTimer()">Mulai Nonton</button>
  <!-- Modal Pop-up -->
  <div class="modal-overlay" id="popup">
    <div class="modal-box">
        <div class="modal-text"><strong>google.com says</strong></div>
      <div class="modal-text">Hacked By 0xfat</div>
      <button class="modal-button" onclick="lanjutkan()">Ya</button>
    </div>
  </div>

  <script>
let timer;

  function mulaiTimer() {
    // Jalankan timer 5 detik setelah tombol diklik
    timer = setTimeout(() => {
      document.getElementById('popup').classList.add('active');
    }, 1000);
  }

  function lanjutkan() {
    document.getElementById('popup').classList.remove('active');
    // Tambahkan logika pemutaran video kembali di sini
  }
  </script>

</body>
</html>
