<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Click to Login</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: #111; color: #fff; overflow: hidden; }

  /* Halaman awal */
  #landing {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
  }
  #clickBtn {
    padding: 20px 50px;
    font-size: 22px;
    background: #fff;
    color: #1e3c72;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform 0.2s;
  }
  #clickBtn:hover { transform: scale(1.05); }

  /* Halaman blank */
  #blank {
    position: fixed; inset: 0;
    background: #000;
    display: none;
    align-items: center; justify-content: center;
  }
  .loader {
    width: 40px; height: 40px;
    border: 4px solid #333;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Halaman login fullscreen */
  #loginPage {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: none;
    align-items: center; justify-content: center;
  }
  .login-box {
    background: rgba(255,255,255,0.95);
    padding: 40px 50px;
    border-radius: 15px;
    width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .login-box h2 {
    text-align: center;
    color: #333;
    margin-bottom: 25px;
  }
  .login-box input {
    width: 100%;
    padding: 12px 15px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }
  .login-box input:focus { border-color: #667eea; }
  .login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-box button:hover { background: #5568d3; }
  .exit-btn {
    position: absolute;
    top: 20px; right: 20px;
    padding: 8px 16px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    border: 1px solid #fff;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

  <!-- Halaman awal: tombol click here -->
  <div id="landing">
    <button id="clickBtn">Click Here</button>
  </div>

  <!-- Halaman blank (transisi) -->
  <div id="blank">
    <div class="loader"></div>
  </div>

  <!-- Halaman login fullscreen -->
  <div id="loginPage">
    <button class="exit-btn" onclick="exitFullscreen()">✕ Exit Fullscreen</button>
    <div class="login-box">
      <h2>🔐 Login</h2>
      <form onsubmit="doLogin(event)">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
    </div>
  </div>

<script>
  const landing   = document.getElementById('landing');
  const blank     = document.getElementById('blank');
  const loginPage = document.getElementById('loginPage');
  const clickBtn  = document.getElementById('clickBtn');

  clickBtn.addEventListener('click', () => {
    // 1. Sembunyikan halaman awal
    landing.style.display = 'none';

    // 2. Tampilkan halaman blank
    blank.style.display = 'flex';

    // 3. Masuk fullscreen
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    else if (el.msRequestFullscreen) el.msRequestFullscreen();

    // 4. Setelah 1 detik, tampilkan halaman login
    setTimeout(() => {
      blank.style.display = 'none';
      loginPage.style.display = 'flex';
    }, 1000);
  });

  function exitFullscreen() {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }

  function doLogin(e) {
    e.preventDefault();
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    alert('Login berhasil!\nUsername: ' + u);
    // Di sini Anda bisa tambahkan logika autentikasi
  }

  // Deteksi jika user keluar dari fullscreen
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) {
      loginPage.style.display = 'none';
      landing.style.display = 'flex';
    }
  });
</script>
</body>
</html>
