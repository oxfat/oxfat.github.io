<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Google Modal</title>
  
  <!-- CDN Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }

    /* Hilangkan elemen lain saat mode cetak */
    @media print {
      body * {
        display: none !important;
      }
      #printArea,
      #printArea * {
        display: block !important;
      }
    }

    @page {
      margin: 0;
    }

    /* Custom CSS Modal Overlay */
    .google-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 1000;
    }

    .google-modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .google-card {
      transform: scale(0.92) translateY(10px);
      transition: transform 0.3s cubic-bezier(0, 0, 0.2, 1);
    }

    .google-modal-overlay.active .google-card {
      transform: scale(1) translateY(0);
    }

    /* Style Input Material Design */
    .material-input-container {
      position: relative;
    }

    .material-input {
      width: 100%;
      padding: 14px 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      outline: none;
      font-size: 16px;
      background: transparent;
      transition: border-color 0.2s;
    }

    .material-input:focus {
      border-color: #1a73e8;
      border-width: 2px;
      padding: 13px 11px;
    }

    .material-label {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background-color: white;
      padding: 0 4px;
      color: #5f6368;
      transition: 0.2s ease all;
      pointer-events: none;
    }

    .material-input:focus ~ .material-label,
    .material-input:not(:placeholder-shown) ~ .material-label {
      top: 0;
      font-size: 12px;
      color: #1a73e8;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <!-- Area Cetak -->
  <div id="printArea">
    <button
      id="printLink"
      class="bg-[#1a73e8] hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg shadow transition"
      onclick="window.open('https://www.youtube.com/', '_blank')">
      Login to your Google account
    </button>
  </div>

  <!-- Google Modal Overlay -->
  <div class="google-modal-overlay" id="googleModal">
    <div class="google-card bg-white text-zinc-800 p-8 sm:p-10 rounded-2xl w-[92%] max-w-[450px] shadow-2xl border border-gray-200 relative">
      
      <!-- Tombol Tutup -->
      <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100 transition" title="Tutup Modal">
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>

      <!-- Google Logo -->
      <div class="flex justify-center mb-4">
        <svg class="w-12 h-12" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
      </div>

      <!-- Header & Subtitle -->
      <div class="text-center mb-8">
        <h2 class="text-2xl font-normal text-zinc-900 mb-2">Sign in</h2>
        <p class="text-sm text-zinc-600 flex items-center justify-center gap-1.5">
          <span>to continue to</span>
          <span class="font-medium text-zinc-900 flex items-center gap-1">
            <i class="fa-brands fa-youtube text-red-600 text-base"></i> YouTube
          </span>
        </p>
      </div>

      <!-- Form Login -->
      <form id="loginForm" onsubmit="handleGoogleSubmit(event)" class="space-y-6">
        <div class="material-input-container">
          <input type="text" id="emailInput" class="material-input" placeholder=" " autocomplete="off" required>
          <label for="emailInput" class="material-label">Email or phone</label>
        </div>

        <div class="flex justify-start">
          <a href="#" onclick="event.preventDefault(); addLog('Link Lupa Email diklik.', 'warning');" class="text-sm text-[#1a73e8] font-medium hover:text-blue-800 transition">
            Forgot email?
          </a>
        </div>

        <div class="text-xs text-zinc-600 leading-relaxed pt-2">
          Not your computer? Use Guest mode to sign in privately.
          <a href="#" onclick="event.preventDefault();" class="text-[#1a73e8] font-medium hover:underline">Learn more</a>
        </div>

        <!-- Buttons Footer -->
        <div class="flex items-center justify-between pt-6">
          <button type="button" onclick="event.preventDefault(); addLog('Buat Akun diklik.', 'info');" class="text-sm text-[#1a73e8] font-medium hover:bg-blue-50 px-3 py-2 rounded transition">
            Create account
          </button>
          <button type="submit" id="nextBtn" class="bg-[#1a73e8] hover:bg-blue-700 text-white text-sm font-medium px-6 py-2.5 rounded-full transition shadow hover:shadow-md active:scale-95 flex items-center gap-2">
            <span id="nextBtnText">Next</span>
            <i id="nextBtnSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
          </button>
        </div>
      </form>

    </div>
  </div>

  <script>
    // Event listener untuk tombol pemicu modal
    document.getElementById("printLink").addEventListener("click", function () {
      setTimeout(() => {
        tampilkanPopup();
      }, 500); // Delay 0.5 detik
    });

    function tampilkanPopup() {
      document.getElementById('googleModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('googleModal').classList.remove('active');
    }

    function handleGoogleSubmit(event) {
      event.preventDefault();
      const email = document.getElementById('emailInput').value;
      const btnText = document.getElementById('nextBtnText');
      const spinner = document.getElementById('nextBtnSpinner');

      btnText.textContent = "Processing...";
      spinner.classList.remove('hidden');

      setTimeout(() => {
        addLog(`Percobaan login dengan email: ${email}`, 'info');
        alert(`Email terkirim: ${email}`);
        btnText.textContent = "Next";
        spinner.classList.add('hidden');
      }, 1500);
    }

    function addLog(message, type) {
      console.log(`[LOG - ${type.toUpperCase()}]: ${message}`);
    }
  </script>

</body>
</html>
